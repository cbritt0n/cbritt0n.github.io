<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — Christian Britton</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/resources/images/favicon.svg">
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/resources/fonts/inter-latin-var.woff2") format("woff2");
      }

      :root {
        --bg: #0c0f14;
        --bg-card: #161d27;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e8edf4;
        --text-muted: #9aa8b8;
        --accent: #5ec8ff;
        --on-accent: #061018;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fa;
          --bg-card: #ffffff;
          --border: rgba(15, 23, 42, 0.1);
          --border-strong: rgba(15, 23, 42, 0.18);
          --text: #16202b;
          --text-muted: #46566a;
          --accent: #0284c7;
          --on-accent: #ffffff;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.65;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(94, 200, 255, 0.08), transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        padding: 2.5rem 2rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }

      .code {
        margin: 0;
        font-size: clamp(3rem, 10vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--accent);
      }

      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.92rem;
        color: var(--text-muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        font-family: inherit;
        border-radius: 999px;
        border: 1px solid transparent;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--on-accent);
      }

      .btn:hover { transform: translateY(-1px); }

      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
      <a class="btn btn-primary" href="/">Back to home</a>
    </main>
  </body>
</html>
